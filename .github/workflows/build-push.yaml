name: Release and Build Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Back-to-back merges queue instead of racing on the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: blacksmith-2vcpu-ubuntu-2604
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      paths: ${{ steps.release.outputs.paths_released }}
    steps:
      # Opens or updates one release PR covering every image dir with conventional
      # commits since its last release. Merging it bumps .release-please-manifest.json
      # and tags <dir>/vX.Y.Z; this same run then builds the released dirs below.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-push:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2604
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.release-please.outputs.paths) }}
    steps:
      - uses: useblacksmith/checkout@v1

      - name: Read version
        id: version
        env:
          DIR: ${{ matrix.dir }}
        run: |
          version=$(jq -er --arg dir "$DIR" '.[$dir]' .release-please-manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: ./${{ matrix.dir }}/Dockerfile

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./${{ matrix.dir }}
          push: true
          tags: ghcr.io/tredy-ai/${{ matrix.dir }}:${{ steps.version.outputs.version }}
